<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Заявки — Office Ops</title><link rel="stylesheet" href="/css/style.css"></head><body><nav th:replace="~{fragments :: nav}"></nav>
<main class="container"><div class="page-head"><div><div class="eyebrow">ОБСЛУЖИВАНИЕ</div><h1>Заявки</h1><p>Контроль неисправностей и хода выполнения работ.</p></div><span class="count" th:text="${#lists.size(items)} + ' заявок'">0 заявок</span></div><div class="alert" th:if="${notice}" th:text="${notice}"></div>
<section class="panel" th:if="${canCreate}"><h2>Новая заявка</h2><form class="form-grid" th:action="@{/tickets}" method="post"><label>Тема<input name="subject" maxlength="180" required placeholder="Не работает проектор"></label><label>Оборудование<select name="assetId" required><option value="">Выберите объект</option><option th:each="asset : ${assets}" th:value="${asset.id}" th:text="${asset.inventoryNumber} + ' — ' + ${asset.name}"></option></select></label><label class="wide">Описание<textarea name="description" maxlength="2000" required rows="3" placeholder="Опишите проблему"></textarea></label><div class="wide"><button class="primary" type="submit">Создать заявку</button></div></form></section>
<section class="panel"><h2>Все заявки</h2><div class="table-wrap"><table><thead><tr><th>№</th><th>Тема</th><th>Оборудование</th><th>Статус</th><th>Исполнитель</th></tr></thead><tbody><tr th:each="item : ${items}"><td class="mono" th:text="${'#' + item.id}"></td><td><a th:href="@{/tickets/{id}(id=${item.id})}" th:text="${item.subject}"></a></td><td th:text="${item.asset.name}"></td><td><span class="badge" th:text="${item.status.title}"></span></td><td th:text="${item.assignee != null ? item.assignee.displayName : '—'}"></td></tr><tr th:if="${#lists.isEmpty(items)}"><td colspan="5" class="empty">Заявок пока нет</td></tr></tbody></table></div></section></main></body></html>
