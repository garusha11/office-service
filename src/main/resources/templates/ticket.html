<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Заявка — Office Ops</title><link rel="stylesheet" href="/css/style.css"></head><body><nav th:replace="~{fragments :: nav}"></nav>
<main class="container"><a class="back" href="/tickets">← Все заявки</a><div class="page-head"><div><div class="eyebrow" th:text="${'ЗАЯВКА #' + ticket.id}"></div><h1 th:text="${ticket.subject}"></h1><p th:text="${ticket.asset.inventoryNumber + ' · ' + ticket.asset.name + ' · ' + ticket.asset.location}"></p></div><span class="badge large" th:text="${ticket.status.title}"></span></div><div class="alert" th:if="${notice}" th:text="${notice}"></div>
<section class="panel"><h2>Описание</h2><p class="description" th:text="${ticket.description}"></p><div class="meta"><span>Создана: <strong th:text="${#temporals.format(ticket.createdAt, 'dd.MM.yyyy HH:mm')}"></strong></span><span>Исполнитель: <strong th:text="${ticket.assignee != null ? ticket.assignee.displayName : 'Не назначен'}"></strong></span></div></section>
<section class="panel" th:if="${canAssign}"><h2>Назначить исполнителя</h2><form class="form-row" th:action="@{/tickets/{id}/assign(id=${ticket.id})}" method="post"><label>Оператор<select name="operatorId" required><option value="">Выберите техника</option><option th:each="op : ${operators}" th:value="${op.id}" th:text="${op.displayName + ' (' + op.username + ')'}"></option></select></label><button class="primary" type="submit">Назначить</button></form></section>
<section class="panel" th:if="${!#lists.isEmpty(commands)}"><h2>Доступные действия</h2><div class="actions"><form th:each="command : ${commands}" th:action="@{/tickets/{id}/commands/{code}(id=${ticket.id},code=${command.code()})}" method="post"><button class="primary" type="submit" th:text="${command.title()}"></button></form></div></section></main></body></html>
