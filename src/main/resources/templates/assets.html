<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Оборудование — Office Ops</title><link rel="stylesheet" href="/css/style.css"></head><body><nav th:replace="~{fragments :: nav}"></nav>
<main class="container"><div class="page-head"><div><div class="eyebrow">РЕЕСТР</div><h1>Оборудование</h1><p>Инвентарные объекты, по которым можно открыть заявку.</p></div><span class="count" th:text="${#lists.size(items)} + ' объектов'">0 объектов</span></div><div class="alert" th:if="${notice}" th:text="${notice}"></div>
<section class="panel" th:if="${canWrite}"><h2>Добавить объект</h2><form class="form-row" th:action="@{/assets}" method="post"><label>Инвентарный №<input name="inventoryNumber" maxlength="60" required placeholder="INV-204"></label><label>Название<input name="name" maxlength="150" required placeholder="Принтер HP"></label><label>Расположение<input name="location" maxlength="150" required placeholder="Корпус А, 204"></label><button class="primary" type="submit">Добавить</button></form></section>
<section class="panel"><h2>Список объектов</h2><div class="table-wrap"><table><thead><tr><th>Инвентарный №</th><th>Название</th><th>Расположение</th></tr></thead><tbody><tr th:each="item : ${items}"><td class="mono" th:text="${item.inventoryNumber}"></td><td th:text="${item.name}"></td><td th:text="${item.location}"></td></tr><tr th:if="${#lists.isEmpty(items)}"><td colspan="3" class="empty">Объектов пока нет</td></tr></tbody></table></div></section></main></body></html>
