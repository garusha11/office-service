<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Доступ — Office Ops</title><link rel="stylesheet" href="/css/style.css"></head><body><nav th:replace="~{fragments :: nav}"></nav>
<main class="container"><div class="page-head"><div><div class="eyebrow">БЕЗОПАСНОСТЬ</div><h1>Управление доступом</h1><p>Разрешения проверяются сервером при каждом действии.</p></div></div><div class="alert" th:if="${notice}" th:text="${notice}"></div>
<section class="panel"><h2>Роли и разрешения</h2><div class="role-grid"><article class="role-card" th:each="role : ${roles}"><div class="role-head"><h3 th:text="${role.title}"></h3><span class="mono" th:text="${role.code}"></span></div><form th:action="@{/access/roles/{id}(id=${role.id})}" method="post"><div class="checks"><label th:each="permission : ${permissions}" th:if="${permission.name() != 'ACCESS_MANAGE' || role.code == 'ADMIN'}"><input type="checkbox" name="permissions" th:value="${permission.name()}" th:checked="${role.permissions.contains(permission)}" th:disabled="${role.code == 'ADMIN'}"><span th:text="${permission.title}"></span></label></div><button class="primary" th:if="${role.code != 'ADMIN'}" type="submit">Сохранить права</button><p class="hint" th:if="${role.code == 'ADMIN'}">Защищённая роль. Права не изменяются.</p></form></article></div></section>
<section class="panel"><h2>Новый оператор</h2><form class="form-grid" th:action="@{/access/operators}" method="post"><label>Логин<input name="username" required minlength="3" maxlength="40" pattern="[a-zA-Z0-9._-]+" placeholder="ivan.petrov"></label><label>Имя<input name="displayName" required maxlength="150" placeholder="Иван Петров"></label><label>Пароль<input name="password" type="password" required minlength="12" placeholder="От 12 символов"></label><label>Роль<select name="roleId" required><option th:each="role : ${roles}" th:if="${role.code != 'ADMIN'}" th:value="${role.id}" th:text="${role.title}"></option></select></label><div class="wide"><button class="primary" type="submit">Создать оператора</button></div></form></section>
<section class="panel"><h2>Операторы</h2><div class="operator-list"><div class="operator" th:each="op : ${operators}"><div><strong th:text="${op.displayName}"></strong><small th:text="${op.username}"></small></div><form th:if="${op.username != 'admin'}" th:action="@{/access/operators/{id}(id=${op.id})}" method="post"><select name="roleId"><option th:each="role : ${roles}" th:if="${role.code != 'ADMIN'}" th:value="${role.id}" th:selected="${role.id.equals(op.role.id)}" th:text="${role.title}"></option></select><label class="inline"><input type="checkbox" name="enabled" value="true" th:checked="${op.enabled}"> Активен</label><button type="submit">Сохранить</button></form><span th:if="${op.username == 'admin'}" class="hint">Главный администратор</span></div></div></section></main></body></html>
