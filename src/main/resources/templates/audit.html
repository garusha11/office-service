<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Журнал — Office Ops</title><link rel="stylesheet" href="/css/style.css"></head><body><nav th:replace="~{fragments :: nav}"></nav>
<main class="container"><div class="page-head"><div><div class="eyebrow">КОНТРОЛЬ</div><h1>Журнал действий</h1><p>Последние 100 изменений в системе.</p></div></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Дата</th><th>Оператор</th><th>Действие</th><th>Объект</th></tr></thead><tbody><tr th:each="item : ${items}"><td class="mono" th:text="${#temporals.format(item.occurredAt, 'dd.MM.yyyy HH:mm')}"></td><td th:text="${item.actor}"></td><td th:text="${item.action}"></td><td th:text="${item.target}"></td></tr><tr th:if="${#lists.isEmpty(items)}"><td colspan="4" class="empty">Записей пока нет</td></tr></tbody></table></div></section></main></body></html>
