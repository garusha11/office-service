<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — Office Ops</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="login-screen"><main class="login-card"><div class="eyebrow">ВНУТРЕННИЙ СЕРВИС</div><h1>Office Ops</h1><p>Панель управления заявками на обслуживание офиса.</p>
<div class="alert error" th:if="${param.error}">Неверный логин, пароль или учётная запись отключена.</div><div class="alert" th:if="${param.logout}">Вы вышли из системы.</div>
<form th:action="@{/login}" method="post"><label>Логин<input name="username" autocomplete="username" required autofocus></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Войти</button></form></main></body></html>
